spring.application.name=TrafficG
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/trafficg}
spring.datasource.username=${DB_USER:trafficg}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
app.demo.seed=${DEMO_SEED:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
